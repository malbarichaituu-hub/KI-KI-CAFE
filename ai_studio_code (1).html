var CART = {}, FAVS = {}, RATINGS = {}, ORDER_HIST = [], CUR_CAT = "Pizza", F = {veg:0,spicy:0,u250:0,favs:0,best:0}, TBL = "", CNAME = "", CNOTE = "", COUPON = {code:"",discount:0}, ORDER_TYPE = "dine_in", DELIVERY_ADDR = "", CONTACT_PHONE = "";

try{
  CART = JSON.parse(localStorage.getItem("kiki_cart") || "{}");
  FAVS = JSON.parse(localStorage.getItem("kiki_favs") || "{}");
  RATINGS = JSON.parse(localStorage.getItem("kiki_ratings") || "{}");
  ORDER_HIST = JSON.parse(localStorage.getItem("kiki_history") || "[]");
  TBL = new URLSearchParams(location.search).get("table") || "";
  CNAME = localStorage.getItem("kiki_name") || "";
  DELIVERY_ADDR = localStorage.getItem("kiki_addr") || "";
  CONTACT_PHONE = localStorage.getItem("kiki_phone") || "";
}catch(e){}

function save(){
  try{
    localStorage.setItem("kiki_cart", JSON.stringify(CART));
    localStorage.setItem("kiki_favs", JSON.stringify(FAVS));
    localStorage.setItem("kiki_ratings", JSON.stringify(RATINGS));
    localStorage.setItem("kiki_history", JSON.stringify(ORDER_HIST));
    localStorage.setItem("kiki_name", CNAME);
    localStorage.setItem("kiki_addr", DELIVERY_ADDR);
    localStorage.setItem("kiki_phone", CONTACT_PHONE);
  }catch(e){}
}

function toast(m){
  var el = document.getElementById("toast");
  el.textContent = m;
  el.style.display = "block";
  setTimeout(function(){ el.style.display = "none"; }, 1800);
}

function setLang(l){
  LANG = l;
  try{ localStorage.setItem("kiki_lang", l); }catch(e){}
  document.querySelectorAll(".lang button").forEach(function(b){ b.classList.remove("on"); });
  var activeBtn = document.getElementById("l-" + l);
  if(activeBtn) activeBtn.classList.add("on");
  document.getElementById("q").placeholder = T[LANG].search;
  renderNav();
  renderList();
  renderBar();
}

function toggleDark(){
  var isDark = document.documentElement.classList.toggle("dark-mode");
  document.getElementById("thIcon").textContent = isDark ? "☀" : "☾";
  try{ localStorage.setItem("kiki_dark", isDark ? "1" : "0"); }catch(e){}
}

if(localStorage.getItem("kiki_dark") === "1"){
  document.documentElement.classList.add("dark-mode");
  var ic = document.getElementById("thIcon");
  if(ic) ic.textContent = "☀";
}

function renderNav(){
  var cats = [];
  ITEMS.forEach(function(it){ if(cats.indexOf(it.category) < 0) cats.push(it.category); });
  var n = document.getElementById("nav");
  n.innerHTML = "";
  cats.forEach(function(c){
    var b = document.createElement("button");
    b.textContent = c;
    if(c === CUR_CAT) b.className = "on";
    b.onclick = function(){
      CUR_CAT = c;
      document.getElementById("q").value = "";
      renderNav();
      renderList();
    };
    n.appendChild(b);
  });
}

function toggleChip(k){
  F[k] = F[k] ? 0 : 1;
  document.getElementById("f-" + k).classList.toggle("on", !!F[k]);
  renderList();
}

function toggleFavFilter(){
  F.favs = F.favs ? 0 : 1;
  F.best = 0;
  document.getElementById("btnFav").classList.toggle("on", !!F.favs);
  document.getElementById("btnBest").classList.remove("on");
  renderList();
}

function toggleBestFilter(){
  F.best = F.best ? 0 : 1;
  F.favs = 0;
  document.getElementById("btnBest").classList.toggle("on", !!F.best);
  document.getElementById("btnFav").classList.remove("on");
  renderList();
}

function renderList(){
  var q = (document.getElementById("q").value || "").trim().toLowerCase();
  var l = document.getElementById("list");
  l.innerHTML = "";
  var count = 0;

  ITEMS.forEach(function(it, idx){
    if(q){
      var hay = (it.item + " " + it.description + " " + it.ingredients + " " + it.category + " " + it.tag).toLowerCase();
      if(hay.indexOf(q) < 0) return;
    } else {
      if(it.category !== CUR_CAT) return;
    }
    if(F.veg && !/^y/i.test(it.veg)) return;
    if(F.spicy && !/spicy|medium/i.test(it.spice)) return;
    if(F.u250 && it.price > 250) return;
    if(F.favs && !FAVS[it.item]) return;
    if(F.best && !it.best) return;

    count++;
    var card = document.createElement("div");
    card.className = "item";
    var isFav = !!FAVS[it.item];
    var userRating = RATINGS[it.item];

    card.innerHTML = 
      '<div class="th">' + it.emoji + 
        '<button class="fav ' + (isFav ? 'on' : '') + '" onclick="toggleFav(event,' + idx + ')">' + (isFav ? '♥' : '♡') + '</button>' +
      '</div>' +
      '<div class="item-info">' +
        '<div class="nm">' + it.item + (it.best ? '<span class="best-tag">🔥 Best</span>' : '') + '</div>' +
        '<div class="ds">' + it.tag + ' · ' + it.spice + '</div>' +
        (userRating ? '<div class="rating-stars">★ ' + userRating + '.0</div>' : '') +
      '</div>' +
      '<div class="pr">₹' + it.price + '</div>' +
      '<button class="plus" onclick="addToCart(event,' + idx + ')">+</button>';

    card.onclick = function(){ showDetail(it); };
    l.appendChild(card);
  });

  if(!count){
    l.innerHTML = '<div style="text-align:center;padding:40px 0;color:#857769">🍽️ No dishes match your filter.</div>';
  }
}

function toggleFav(e, idx){
  e.stopPropagation();
  var it = ITEMS[idx];
  if(FAVS[it.item]) delete FAVS[it.item];
  else FAVS[it.item] = 1;
  save();
  renderList();
  toast(FAVS[it.item] ? "❤️ Added to favorites" : "♡ Removed from favorites");
}

function addToCart(e, idx){
  if(e) e.stopPropagation();
  var it = ITEMS[idx];
  CART[it.item] = (CART[it.item] || 0) + 1;
  save();
  renderBar();
  toast("✓ " + it.item + " added");
}

function totals(){
  var n = 0, sum = 0;
  Object.keys(CART).forEach(function(k){
    var qty = CART[k];
    var it = ITEMS.find(function(x){ return x.item === k; });
    if(it){ n += qty; sum += qty * it.price; }
  });
  var disc = Math.round((sum * COUPON.discount) / 100);
  return { count: n, sum: sum, disc: disc, finalTotal: Math.max(0, sum - disc) };
}

function renderBar(){
  var t = totals();
  var b = document.getElementById("cbar");
  document.body.classList.toggle("hascart", t.count > 0);
  if(t.count > 0){
    b.className = "cbar show";
    document.getElementById("cbar-text").textContent = "🧾 " + T[LANG].myorder + " · " + t.count + " " + (t.count === 1 ? T[LANG].item : T[LANG].items);
    document.getElementById("cbar-price").textContent = "₹" + t.finalTotal + " · " + T[LANG].view + " ›";
  } else {
    b.className = "cbar";
  }
  updateHistoryBadge();
}

function updateHistoryBadge(){
  var el = document.getElementById("histCount");
  if(ORDER_HIST.length > 0){
    el.style.display = "inline-block";
    el.textContent = ORDER_HIST.length;
  } else {
    el.style.display = "none";
  }
}

  var starsHtml = [1,2,3,4,5].map(function(s){
    return '<button style="background:none;border:0;font-size:24px;cursor:pointer;color:' + (s <= userRating ? '#f59e0b' : '#d1c7bc') + '" onclick="rateDish(\'' + it.item + '\',' + s + ')">★</button>';
  }).join('');

  var h = 
    '<div class="grab"></div><button class="x" onclick="closeSheet()">✕</button>' +
    '<div class="vid">' + it.emoji + '</div>' +
    '<div class="row"><h2>' + it.item + '</h2><div class="pr" style="font-size:20px">₹' + it.price + '</div></div>' +
    '<div class="tags"><span>' + (it.veg === 'yes' ? '🟢 Veg' : '🔴 Non-veg') + '</span><span>' + it.spice + '</span><span>' + it.tag + '</span></div>' +
    '<p style="font-size:13px;line-height:1.5;color:#453d33">' + it.description + '</p>' +
    '<p style="font-size:12px;color:#7d7162"><b>Tastes like:</b> ' + it.tastes_like + '</p>' +
    '<p style="font-size:12px;color:#7d7162"><b>Ingredients:</b> ' + it.ingredients + '</p>' +
    '<div style="margin:12px 0;padding:10px;background:#eee5d8;border-radius:12px;display:flex;justify-content:space-between;align-items:center">' +
      '<span style="font-size:12px;font-weight:700">Rate this dish:</span>' +
      '<div>' + starsHtml + '</div>' +
    '</div>' +
    '<button class="wa" style="background:#292621" onclick="CART[\'' + it.item + '\']=(CART[\'' + it.item + '\']||0)+1;save();renderBar();closeSheet();toast(\'✓ Added to order\')">➕ ' + T[LANG].add + ' · ₹' + it.price + '</button>';

  openSheet(h);

function rateDish(itemName, r){
  RATINGS[itemName] = r;
  save();
  renderList();
  var it = ITEMS.find(function(x){ return x.item === itemName; });
  if(it) showDetail(it);
  toast("⭐ Rated " + r + "/5");
}

function changeQty(k, d){
  CART[k] = (CART[k] || 0) + d;
  if(CART[k] <= 0) delete CART[k];
  save();
  renderBar();
  openCart();
}

function sendOrderWA(){
  var ks = Object.keys(CART);
  if(!ks.length) return;

  if(ORDER_TYPE === 'delivery' && !DELIVERY_ADDR.trim()){
    toast("⚠️ Please enter Delivery Address");
    return;
  }

  var t = totals();
  var id = "#" + Math.floor(1000 + Math.random() * 9000);
  var when = new Date().toLocaleString("en-IN", {day:"2-digit",month:"short",hour:"numeric",minute:"2-digit",hour12:true});
  var ln = "━━━━━━━━━━━━━━";

  var m = "🍽️ *" + CAFE.name.toUpperCase() + "*\n" + ln + "\n";
  if(ORDER_TYPE === 'delivery'){
    m += "🛵 *Home Delivery Order* " + id + "\n";
    if(CNAME) m += "👤 Customer: *" + CNAME + "*\n";
    if(CONTACT_PHONE) m += "📞 Phone: *" + CONTACT_PHONE + "*\n";
    if(DELIVERY_ADDR) m += "📍 Address: *" + DELIVERY_ADDR + "*\n";
  } else if(ORDER_TYPE === 'takeaway'){
    m += "🛍️ *Takeaway / Parcel Order* " + id + "\n";
    if(CNAME) m += "👤 Customer: *" + CNAME + "*\n";
    if(CONTACT_PHONE) m += "📞 Phone: *" + CONTACT_PHONE + "*\n";
  } else {
    m += "🪑 *Dine-in Order* " + id + "\n";
    if(TBL) m += "🪑 Table: *" + TBL + "*\n";
    if(CNAME) m += "👤 Customer: *" + CNAME + "*\n";
  }

  m += "🕒 " + when + "\n" + ln + "\n*Items (" + t.count + ")*\n";

  var histItems = [];
  ks.forEach(function(k, idx){
    var it = ITEMS.find(function(x){ return x.item === k; });
    var qty = CART[k];
    m += (idx + 1) + ". " + it.emoji + " " + k + " × " + qty + " — ₹" + (qty * it.price) + "\n";
    histItems.push({ item: it, quantity: qty });
  });

  m += ln + "\n";
  if(t.disc) m += "🎟️ Discount: " + COUPON.discount + "% (Code: " + COUPON.code + ")\n";
  m += "💰 *Total: ₹" + t.finalTotal + "*\n" + ln + "\n";
  if(CNOTE) m += "📝 Note: _" + CNOTE + "_\n";
  m += "_Sent from " + CAFE.name + " menu_";

  // SAVE TO ORDER HISTORY (in localStorage!)
  var orderRecord = {
    id: id,
    items: histItems,
    total: t.finalTotal,
    type: ORDER_TYPE,
    table: TBL,
    address: DELIVERY_ADDR,
    timestamp: when,
    note: CNOTE
  };
  ORDER_HIST.unshift(orderRecord);
  ORDER_HIST = ORDER_HIST.slice(0, 25);
  save();
  updateHistoryBadge();

  // WhatsApp Redirect
  window.open("https://wa.me/" + CAFE.whatsapp + "?text=" + encodeURIComponent(m), "_blank");

  CART = {};
  save();
  renderBar();
  closeSheet();
  openFeedback(id);
}

function payUpi(tot){
  var u = "upi://pay?pa=" + CAFE.upi + "&pn=" + encodeURIComponent(CAFE.name) + "&am=" + tot + "&cu=INR&tn=" + encodeURIComponent("Kiki Cafe Order " + (TBL ? "Table " + TBL : ""));
  window.location.href = u;
}

/* ================= ORDER HISTORY PANEL ================= */
function openHistory(){
  if(!ORDER_HIST.length){
    openSheet(
      '<div class="grab"></div><button class="x" onclick="closeSheet()">✕</button>' +
      '<div style="text-align:center;padding:40px 0;color:#7d7162">' +
        '<div style="font-size:48px">📜</div>' +
        '<h3 style="font:700 18px \'Playfair Display\',serif;margin:8px 0 4px">' + T[LANG].nohist + '</h3>' +
        '<p style="font-size:12px">' + T[LANG].nohistdesc + '</p>' +
      '</div>'
    );
    return;
  }

  var listHtml = ORDER_HIST.map(function(order, oIdx){
    var itemsList = order.items.map(function(ci){
      return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:3px 0">' +
        '<span>' + ci.item.emoji + ' ' + ci.item.item + ' × ' + ci.quantity + '</span>' +
        '<b>₹' + (ci.item.price * ci.quantity) + '</b>' +
      '</div>';
    }).join('');

    return '<div class="h-item">' +
      '<div class="h-head">' +
        '<div>' +
          '<b>' + order.id + '</b>' + (order.table ? ' <span style="font-size:11px;background:#eee5d8;padding:2px 6px;border-radius:6px">Table #' + order.table + '</span>' : '') +
          '<div style="font-size:10px;color:#8a7f72;margin-top:2px">' + order.timestamp + '</div>' +
        '</div>' +
        '<div style="font:700 15px system-ui">₹' + order.total + '</div>' +
      '</div>' +
      '<div style="border-top:1px dashed #eee;padding-top:6px">' + itemsList + '</div>' +
      '<button class="h-reorder" onclick="reorderMeal(' + oIdx + ')">🔄 ' + T[LANG].reorder + '</button>' +
    '</div>';
  }).join('');

  var h = 
    '<div class="grab"></div><button class="x" onclick="closeSheet()">✕</button>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
      '<h2 style="margin:0;font:700 20px \'Playfair Display\',serif">📜 ' + T[LANG].history + '</h2>' +
      '<button onclick="ORDER_HIST=[];save();openHistory();updateHistoryBadge();" style="border:0;background:none;color:#e11d48;font-size:11px;cursor:pointer;font-weight:700">Clear</button>' +
    '</div>' +
    listHtml;

  openSheet(h);
}

function reorderMeal(idx){
  var order = ORDER_HIST[idx];
  if(!order) return;
  order.items.forEach(function(ci){
    CART[ci.item.item] = (CART[ci.item.item] || 0) + ci.quantity;
  });
  if(order.table) TBL = order.table;
  save();
  renderBar();
  closeSheet();
  toast(T[LANG].reordered);
  setTimeout(openCart, 300);
}

function serviceCall(type){
  var isCall = type === 'call';
  var msg = (isCall ? "🔔 *Waiter Called*" : "🧾 *Bill Requested*") + "\n🪑 Table: *" + (TBL || "Counter") + "*\n🕒 " + new Date().toLocaleTimeString("en-IN") + "\n_" + CAFE.name + " Digital Menu_";
  window.open("https://wa.me/" + CAFE.whatsapp + "?text=" + encodeURIComponent(msg), "_blank");
  toast(isCall ? "🔔 Waiter alerted" : "🧾 Bill requested");
}

function openCoupons(){
  openSheet(
    '<div class="grab"></div><button class="x" onclick="closeSheet()">✕</button>' +
    '<h2 style="font:700 20px \'Playfair Display\',serif;margin:4px 0 10px">🎁 Offers & Coupons</h2>' +
    '<div style="padding:14px;border:1px dashed #8a5a2b;border-radius:14px;background:#f5ecdf">' +
      '<b>FIRST10</b> · 10% Flat Discount<p style="font-size:12px;margin:4px 0">Valid on all pizzas, pastas, frappes and mojitos.</p>' +
      '<button class="wa" style="margin-top:8px" onclick="COUPON={code:\'FIRST10\',discount:10};renderBar();closeSheet();toast(\'🎁 10% Coupon applied!\')">Apply Code FIRST10</button>' +
    '</div>'
  );
}

function openStatus(){
  var last = ORDER_HIST[0];
  openSheet(
    '<div class="grab"></div><button class="x" onclick="closeSheet()">✕</button>' +
    '<h2 style="font:700 20px \'Playfair Display\',serif;margin:4px 0 10px">⏱️ Active Order Status</h2>' +
    (last ? 
      '<div style="padding:14px;background:#fff;border-radius:14px;border:1px solid #e4ddd3">' +
        '<b>Order ' + last.id + '</b> (Table #' + (last.table || 'Counter') + ')' +
        '<div style="display:flex;gap:8px;margin-top:12px;text-align:center;font-size:11px">' +
          '<div style="flex:1;background:#292621;color:#fff;padding:6px;border-radius:8px">1. Placed ✓</div>' +
          '<div style="flex:1;background:#eee5d8;color:#292621;padding:6px;border-radius:8px">2. Preparing 🔥</div>' +
          '<div style="flex:1;background:#eee5d8;color:#292621;padding:6px;border-radius:8px">3. Ready ✨</div>' +
        '</div>' +
      '</div>'
      : '<p style="font-size:13px;color:#7d7162">No active orders placed yet.</p>'
    )
  );
}

function openFeedback(orderId){
  openSheet(
    '<div class="grab"></div><button class="x" onclick="closeSheet()">✕</button>' +
    '<h2 style="text-align:center;font:700 22px \'Playfair Display\',serif;margin:6px 0">Thank You! 🙏</h2>' +
    '<p style="text-align:center;font-size:13px;color:#7d7162">Order ' + (orderId || '') + ' sent to Kiki Cafe.</p>' +
    '<a class="wa" style="text-decoration:none;margin-top:12px" href="' + CAFE.reviewUrl + '" target="_blank">⭐ Rate us on Google Reviews</a>'
  );
}

function openSheet(h){
  document.getElementById("panel").innerHTML = h;
  document.getElementById("sheet").classList.add("show");
}

function closeSheet(){
  document.getElementById("sheet").classList.remove("show");
}

document.getElementById("q").oninput = renderList;
renderNav();
renderList();
renderBar();
</script>
