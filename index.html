<style>
:root{--bg:#faf3ea;--card:#fff;--ink:#3b2a20;--mute:#8a7566;--acc:#8a5a2b;--line:#eadccb}
@media (prefers-color-scheme:dark){:root{--bg:#1f1812;--card:#2a2119;--ink:#f3e8da;--mute:#b3a08c;--line:#3a2e24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif;max-width:480px;margin:0 auto}
header{padding:20px 16px 6px;text-align:center}
h1{margin:0;font-size:26px}
.sub{color:var(--mute);font:13px system-ui,sans-serif;margin-top:4px}
nav{display:flex;gap:8px;padding:10px 16px;position:sticky;top:0;background:var(--bg);z-index:2;overflow-x:auto}
nav button{flex:none;padding:9px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;font:600 14px system-ui,sans-serif}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 16px 10px;padding:10px;cursor:pointer}
.item.out{opacity:.5}
.th{width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;flex:none;background:var(--line) center/cover}
.th i{position:absolute;right:4px;bottom:4px;font:10px system-ui;font-style:normal;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:1px 5px}
.nm{font-weight:700;font-size:16px}
.ds{font:12px system-ui,sans-serif;color:var(--mute);margin-top:2px}
.pr{margin-left:auto;font:700 15px system-ui,sans-serif;color:var(--acc)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:14px 16px 20px;max-height:92%;overflow:auto}
.vid{height:240px;border-radius:14px;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden}
.vid video,.vid img{width:100%;height:100%;object-fit:cover}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.row h2{margin:0;font-size:22px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;font:12px system-ui,sans-serif}
.tags span{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:3px 9px}
p{font:14px/1.5 system-ui,sans-serif;margin:6px 0}
.x{float:right;border:0;background:var(--card);color:var(--ink);border-radius:50%;width:32px;height:32px;margin-bottom:6px}
</style>
</head>

var items=[],cats=[],cur="";
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function csv(t){var r=[],row=[],f="",q=false;for(var i=0;i<t.length;i++){var c=t[i];
 if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}
 else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
 else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);f="";if(row.join("")!="")r.push(row);row=[]}else f+=c}
 row.push(f);if(row.join("")!="")r.push(row);
 var h=r.shift().map(function(x){return x.trim().toLowerCase()});
 return r.map(function(a){var o={};h.forEach(function(k,i){o[k]=(a[i]||"").trim()});
  o.price=Number(o.price);o.available=!/^(no|false|0|out)$/i.test(o.available||"yes");return o})}
function start(){
 document.getElementById("cname").textContent=CAFE.name;
 document.getElementById("ctag").textContent=CAFE.tagline;
 document.title=CAFE.name+" – Menu";
 document.documentElement.style.setProperty("--acc",CAFE.accent);
 if(CAFE.sheetCsvUrl){
  fetch(CAFE.sheetCsvUrl).then(function(r){return r.text()}).then(function(t){init(csv(t))})
   .catch(function(){init(CAFE.items)});
 }else init(CAFE.items);
}
function init(arr){items=arr;cats=[];items.forEach(function(d){if(cats.indexOf(d.category)<0)cats.push(d.category)});cur=cats[0];nav();list()}
function nav(){var n=document.getElementById("nav");n.innerHTML="";cats.forEach(function(c){var b=document.createElement("button");b.textContent=c;b.className=c==cur?"on":"";b.onclick=function(){cur=c;nav();list()};n.appendChild(b)})}
function list(){var l=document.getElementById("list");l.innerHTML="";
 items.forEach(function(d,i){if(d.category!=cur)return;var e=document.createElement("div");e.className="item"+(d.available?"":" out");
  var bg=d.photo?' style="background-image:url('+esc(d.photo)+')"':"";
