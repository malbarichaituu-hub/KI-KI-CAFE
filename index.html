:root{--bg:#faf3ea;--card:#fff;--ink:#3b2a20;--mute:#8a7566;--acc:#8a5a2b;--line:#eadccb;--hero:#f1dfc6;--on:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;max-width:480px;margin:0 auto;padding-bottom:30px}
header{padding:calc(26px + env(safe-area-inset-top,0px)) 20px 18px;text-align:center;background:linear-gradient(180deg,var(--hero),var(--bg));border-radius:0 0 28px 28px}
h1{margin:0;font:700 32px Georgia,'Times New Roman',serif;letter-spacing:.5px}
.sub{color:var(--mute);font-size:13px;margin-top:6px}
nav{display:flex;gap:8px;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:2;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;padding:9px 18px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;font:600 14px system-ui,sans-serif}
nav button.on{background:var(--acc);color:var(--on);border-color:var(--acc);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.item{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;margin:0 16px 12px;padding:12px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .15s}
.item:active{transform:scale(.98)}
.item.out{opacity:.5}
.th{width:76px;height:76px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;flex:none;background:var(--hero) center/cover}
.th i{position:absolute;right:5px;bottom:5px;font:600 10px system-ui;font-style:normal;background:var(--acc);color:var(--on);border-radius:10px;padding:2px 7px}
.nm{font:700 17px Georgia,'Times New Roman',serif}
.ds{display:inline-block;margin-top:6px;font:600 11px system-ui,sans-serif;color:var(--acc);background:var(--hero);border-radius:10px;padding:3px 9px}
.pr{margin-left:auto;font:700 16px system-ui,sans-serif;color:var(--acc);white-space:nowrap}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:16px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.vid{height:260px;border-radius:20px;background:var(--hero);display:flex;align-items:center;justify-content:center;font-size:90px;overflow:hidden}
.vid video,.vid img{width:100%;height:100%;object-fit:cover}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;gap:10px}
.row h2{margin:0;font:700 24px Georgia,'Times New Roman',serif}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0;font-size:12px}
.tags span{background:var(--hero);color:var(--ink);border-radius:12px;padding:4px 10px;font-weight:600}
p{font-size:14px;line-height:1.55;margin:7px 0}
.x{float:right;border:0;background:var(--card);color:var(--ink);border-radius:50%;width:34px;height:34px;margin-bottom:8px;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.15)}

header h1,.sub{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.sub{animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes bob{50%{transform:translateY(-8px) scale(1.06)}}
.item{animation:pop .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.item:active{transform:scale(.97);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.item:active .th{transform:scale(1.08) rotate(-3deg)}
.th{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
nav button{transition:background .2s,color .2s,transform .15s,box-shadow .2s}
nav button:active{transform:scale(.92)}
.sheet.show{animation:fade .2s both}
.sheet.closing{animation:fadeout .22s both}
.sheet.closing .panel{animation:down .22s ease-in both}
.panel{animation:up .35s cubic-bezier(.2,.9,.3,1.15) both;touch-action:pan-y}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.vid{background:linear-gradient(100deg,var(--hero) 30%,var(--card) 50%,var(--hero) 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.vid video{opacity:0;transition:opacity .4s}
.vid video.on{opacity:1}
.vid>span,.vid.emo{animation:bob 2.6s ease-in-out infinite}
.row,.tags,p{animation:rise .4s .12s cubic-bezier(.2,.8,.2,1) both}
.x:active{transform:scale(.88)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.inst{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;border:0;border-radius:24px;padding:12px 20px;background:var(--acc);color:var(--on);font:700 14px system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.3);display:none}
.tools{padding:4px 16px 0}
#q{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:15px system-ui,sans-serif;outline:none}
#q:focus{border-color:var(--acc)}
#chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
#chips button{flex:none;padding:7px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;font:600 13px system-ui,sans-serif}
#chips button.on{background:var(--hero);border-color:var(--acc);color:var(--acc)}
.plus{margin-left:8px;flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--acc);color:var(--on);font:700 20px/1 system-ui;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.plus:active{transform:scale(.85)}
.cbar{position:fixed;left:16px;right:16px;max-width:448px;margin:0 auto;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;display:none;justify-content:space-between;align-items:center;background:var(--acc);color:var(--on);border-radius:20px;padding:14px 18px;font:700 15px system-ui,sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.3);cursor:pointer}
.cbar.show{display:flex;animation:rise .3s both}
.cbar.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.04)}}
body.hascart{padding-bottom:100px}
body.hascart .inst{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.addbtn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:16px;background:var(--acc);color:var(--on);font:700 15px system-ui,sans-serif}
.review{display:block;margin:6px 16px 20px;text-align:center;padding:14px;border-radius:16px;border:1px solid var(--acc);color:var(--acc);text-decoration:none;font:700 14px system-ui,sans-serif;background:var(--card)}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.cr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.cr b{flex:1}
.cr button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 16px system-ui}
.tot{display:flex;justify-content:space-between;font:700 18px system-ui,sans-serif;margin:14px 0 4px}
.clr{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--mute);font:600 14px system-ui,sans-serif}
header{position:relative;padding-top:calc(46px + env(safe-area-inset-top,0px))}
.lang{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:5px 9px;font:600 12px system-ui,sans-serif}
.lang button.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.info{margin:0 16px 20px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;font:14px system-ui,sans-serif}
.info h3{margin:0 0 12px;font:700 18px Georgia,serif}
.ib{display:flex;gap:8px;flex-wrap:wrap}
.ib a{padding:9px 14px;border-radius:14px;background:var(--hero);color:var(--ink);text-decoration:none;font-weight:600}
.info .ln{margin-top:8px}
.pairs{margin-top:14px;font-size:13px}

.banner{margin:12px 16px 0;padding:12px 14px;border-radius:16px;background:var(--acc);color:var(--on);font:600 14px system-ui,sans-serif;text-align:center}
.svc{display:flex;gap:8px;margin-top:10px}
.svc button{flex:1;padding:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:14px;font:700 13px system-ui,sans-serif}
.stars{display:flex;gap:4px;justify-content:center;margin:8px 0;border-radius:14px;padding:4px}
.stars.need{outline:2px solid #e57373}
.stars button{border:0;background:none;font-size:40px;color:var(--acc);padding:0 4px}

function setR(i){R=i;var b=document.querySelectorAll("#stars button");for(var j=0;j<b.length;j++)b[j].textContent=j<i?"★":"☆";document.getElementById("stars").className="stars"}
function sendFB(){if(!R){document.getElementById("stars").className="stars need";return}
 var m="⭐ *Feedback – "+String(CAFE.name).toUpperCase()+"*\n"+"★★★★★".slice(0,R)+"☆☆☆☆☆".slice(R)+" ("+R+"/5)\n";
 if(TBL)m+="🪑 Table: *"+TBL+"*\n";if(LASTID)m+="🧾 Order "+LASTID+"\n";if(CM)m+="💬 _"+CM+"_\n";m+="_Sent from the "+CAFE.name+" menu_";
 track("feedback",{rating:R});wa(m);shut()}
function newOrder(){cart={};save();bar();shut()}
function askTable(k){openSheet('<div class="grab"></div><button class="x" onclick="shut()">✕</button><h2 style="margin:6px 0 10px;font:700 20px Georgia,serif">'+tx("askt")+'</h2><input id="tbl2" placeholder="'+tx("tbl")+'" value="'+esc(TBL)+'" oninput="TBL=this.value"><button class="wa" onclick="svc(\''+k+'\')">'+tx("sendt")+'</button>')}
function svc(k){if(!TBL){askTable(k);return}
 var m=(k=="bill"?"🧾 *Bill requested*":"🔔 *Waiter called*")+"\n🪑 Table: *"+TBL+"*\n🕒 "+nowS()+"\n_"+CAFE.name+" menu_";
 track("service_"+k,{});wa(m);if(k=="bill")showThanks("bill");else shut()}
function buildSvc(){document.getElementById("svc").innerHTML='<button onclick="svc(\'call\')">🔔 '+tx("callw")+'</button><button onclick="svc(\'bill\')">🧾 '+tx("bill")+'</button>'}
function renderBanner(){var b=CAFE.banner||{},e=document.getElementById("banner"),x=b["text_"+LANG]||b.text;e.className=x?"banner":"";e.innerHTML=x?"🔥 "+esc(x):""}
function upiHtml(tot){var u=CAFE.upi||{};if(!u.id||!tot)return "";return '<a class="wa" style="display:block;text-align:center;text-decoration:none;background:#5f259f" href="'+esc(upiUrl(tot))+'" onclick="payUPI('+tot+',event)">💳 '+tx("pay")+' ₹'+tot+'</a>'}
function match(d){var q=document.getElementById("q").value.trim().toLowerCase();
 if(q){var h=(d.item+" "+d.description+" "+d.ingredients+" "+d.category+" "+d.tag).toLowerCase();if(h.indexOf(q)<0)return false}else if(d.category!=cur)return false;
 if(F.veg&&!/^y/i.test(d.veg))return false;
 if(F.spicy&&!/^(spicy|medium)$/i.test(d.spice||""))return false;
 if(F.u250&&!(d.price<=250))return false;
 return true}
function chips(){var c=document.getElementById("chips");c.innerHTML="";[["veg","🟢 "+tx("veg")],["spicy","🌶 "+tx("spicy")],["u250",tx("u250")]].forEach(function(x){var b=document.createElement("button");b.textContent=x[1];b.className=F[x[0]]?"on":"";b.onclick=function(){F[x[0]]=F[x[0]]?0:1;b.className=F[x[0]]?"on":"";list()};c.appendChild(b)})}
chips();document.getElementById("q").oninput=function(){list()};
function save(){try{var o={};Object.keys(cart).forEach(function(k){o[k]=cart[k].q});localStorage.setItem("cart:"+CAFE.name,JSON.stringify(o))}catch(e){}}
function restore(){try{var o=JSON.parse(localStorage.getItem("cart:"+CAFE.name)||"{}");items.forEach(function(d){if(o[d.item]&&d.available)cart[d.item]={d:d,q:o[d.item]}})}catch(e){}}
function totals(){var n=0,t=0;Object.keys(cart).forEach(function(k){n+=cart[k].q;t+=cart[k].q*cart[k].d.price});return [n,t]}
function bar(bump){var b=document.getElementById("cbar"),t=totals();document.body.classList.toggle("hascart",t[0]>0);b.className="cbar"+(t[0]?" show":"")+(bump?" bump":"");b.innerHTML="<span>🧾 "+tx("myorder")+" · "+t[0]+" "+(t[0]==1?tx("item"):tx("items"))+"</span><span>₹"+t[1]+" · "+tx("view")+" ›</span>"}
function add(d){track("add_to_order",{item:d.item});cart[d.item]=cart[d.item]||{d:d,q:0};cart[d.item].q++;save();bar(1)}
function openCart(){var ks=Object.keys(cart),t=totals();if(!ks.length){shut();return}
 var h='<div class="grab"></div><button class="x" onclick="shut()">✕</button><h2 style="margin:6px 0 4px;font:700 22px Georgia,serif">'+tx("myorder")+'</h2>';
 ks.forEach(function(k,i){var c=cart[k];h+='<div class="cr"><b>'+esc(k)+'</b><button onclick="chg('+i+',-1)">−</button><span>'+c.q+'</span><button onclick="chg('+i+',1)">+</button><span style="width:62px;text-align:right">₹'+c.q*c.d.price+'</span></div>'});
 h+='<div class="tot"><span>'+tx("total")+'</span><span>₹'+t[1]+'</span></div><p>'+tx("waiter")+'</p><input id="tbl" placeholder="'+tx("tbl")+'" value="'+esc(TBL)+'" oninput="TBL=this.value"><input id="cn" placeholder="'+tx("cname")+'" value="'+esc(NAME)+'" oninput="NAME=this.value"><input id="cnote" placeholder="'+tx("cnote")+'" value="'+esc(NOTE)+'" oninput="NOTE=this.value"><button class="wa" onclick="sendWA()">💬 '+tx("sendwa")+'</button>'+upiHtml(t[1])+'<button class="clr" onclick="clr()">'+tx("clear")+'</button>';
 document.getElementById("panel").innerHTML=h;document.getElementById("sheet").classList.add("show")}
function chg(i,dl){var k=Object.keys(cart)[i];cart[k].q+=dl;if(cart[k].q<=0)delete cart[k];save();bar();openCart()}
function clr(){cart={};save();bar();shut()}

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function csv(t){var r=[],row=[],f="",q=false;for(var i=0;i<t.length;i++){var c=t[i];
 if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}
 else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
 else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);f="";if(row.join("")!="")r.push(row);row=[]}else f+=c}
 row.push(f);if(row.join("")!="")r.push(row);
 var h=r.shift().map(function(x){return x.trim().toLowerCase()});
 return r.map(function(a){var o={};h.forEach(function(k,i){o[k]=(a[i]||"").trim()});
  o.price=Number(o.price);o.available=!/^(no|false|0|out)$/i.test(o.available||"yes");return o})}
function start(){
 document.getElementById("cname").textContent=CAFE.name;
 document.getElementById("ctag").textContent=CAFE.tagline;
 document.title=CAFE.name+" – Menu";initAnalytics();
 if(CAFE.reviewUrl){var ra=document.createElement("a");ra.className="review";ra.href=CAFE.reviewUrl;ra.target="_blank";ra.rel="noopener";ra.onclick=function(){track("review_click",{})};ra.textContent="⭐ Enjoyed your visit? Rate us on Google";document.getElementById("list").after(ra)}
 var T=THEMES[CAFE.theme]||THEMES.warm;Object.keys(T).forEach(function(k){document.documentElement.style.setProperty("--"+k,T[k])});
 if(CAFE.sheetCsvUrl){
  fetch(CAFE.sheetCsvUrl).then(function(r){return r.text()}).then(function(t){init(csv(t))})
   .catch(function(){init(CAFE.items)});
 }else init(CAFE.items);
}
function init(arr){items=arr;cats=[];items.forEach(function(d){if(cats.indexOf(d.category)<0)cats.push(d.category)});cur=cats[0];restore();nav();list();bar();applyLang()}
function nav(){var n=document.getElementById("nav");n.innerHTML="";cats.forEach(function(c){var b=document.createElement("button");b.textContent=catn(c);b.className=c==cur?"on":"";b.onclick=function(){cur=c;document.getElementById("q").value="";track("category",{name:c});nav();list()};n.appendChild(b)})}
function list(){var l=document.getElementById("list");l.innerHTML="";
 var k=0;items.forEach(function(d,i){if(!match(d))return;var e=document.createElement("div");e.className="item"+(d.available?"":" out");
  var bg=d.photo?' style="background-image:url('+esc(d.photo)+')"':"";
  e.innerHTML='<div class="th"'+bg+'>'+(d.photo?"":esc(d.emoji||"🍽"))+(d.video?"<i>▶</i>":"")+'</div><div><div class="nm">'+esc(d.item)+'</div><div class="ds">'+esc(d.available?d.tag:tx("out"))+'</div></div><div class="pr">₹'+esc(d.price)+'</div>'+(d.available?'<button class="plus" aria-label="Add">+</button>':'');
  e.style.setProperty("--i",k++);e.onclick=function(){show(d)};var pb=e.querySelector(".plus");if(pb)pb.onclick=function(ev){ev.stopPropagation();add(d)};l.appendChild(e)});if(!k)l.innerHTML='<p class="empty">'+tx("none")+'</p>'}
function show(d){track("view_item",{item:d.item});
 var media=d.video?'<video src="'+esc(d.video)+'" poster="'+esc(d.photo)+'" muted loop playsinline autoplay onloadeddata="this.className=&quot;on&quot;"></video>':(d.photo?'<img src="'+esc(d.photo)+'" alt="">':esc(d.emoji||"🍽"));
 document.getElementById("panel").innerHTML='<div class="grab"></div><button class="x" onclick="shut()">✕</button><div class="vid'+(d.video||d.photo?'':' emo')+'">'+media+'</div>'+
 '<div class="row"><h2>'+esc(d.item)+'</h2><div class="pr">₹'+esc(d.price)+'</div></div>'+
 '<div class="tags"><span>'+(/^y/i.test(d.veg)?"🟢 "+tx("veg"):"🔴 "+tx("nonveg"))+'</span>'+(d.spice?'<span>'+esc(sp(d.spice))+'</span>':"")+(d.tag?'<span>'+esc(d.tag)+'</span>':"")+(d.available?"":"<span>"+tx("out")+"</span>")+'</div>'+
 '<p>'+esc(dl(d,"description"))+'</p>'+(d.tastes_like?'<p><b>'+tx("tastes")+'</b> '+esc(dl(d,"tastes_like"))+'</p>':"")+(d.ingredients?'<p><b>'+tx("ingr")+'</b> '+esc(d.ingredients)+'</p>':"")+pairsHtml(d)+(d.available?'<button class="addbtn" id="ab">'+tx("addorder")+' · ₹'+esc(d.price)+'</button>':"");
 var ab=document.getElementById("ab");if(ab)ab.onclick=function(){add(d);ab.textContent=tx("added")};
 document.getElementById("sheet").classList.add("show")}
function shut(){var s=document.getElementById("sheet");if(!s.classList.contains("show")||s.classList.contains("closing"))return;s.classList.add("closing");setTimeout(function(){s.classList.remove("show","closing");var v=document.querySelector("#panel video");if(v)v.pause()},220)}
document.getElementById("sheet").onclick=function(e){if(e.target==this)shut()};
var sy=0,dy=0,P=document.getElementById("panel");
P.addEventListener("touchstart",function(e){sy=e.touches[0].clientY;dy=0},{passive:true});
P.addEventListener("touchmove",function(e){dy=e.touches[0].clientY-sy;if(dy>0&&P.scrollTop<=0){P.style.transition="none";P.style.transform="translateY("+dy+"px)"}},{passive:true});
P.addEventListener("touchend",function(){P.style.transition="";P.style.transform="";if(dy>110&&P.scrollTop<=0)shut();dy=0});
start();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
var dp=null,ib=document.createElement("button");ib.className="inst";ib.textContent="📲 Install app";document.body.appendChild(ib);
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;ib.style.display="block"});
ib.onclick=function(){if(!dp)return;dp.prompt();dp.userChoice.then(function(){dp=null;ib.style.display="none"})};
window.addEventListener("appinstalled",function(){ib.style.display="none"});
</script>
